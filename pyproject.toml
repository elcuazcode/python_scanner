[project]
name = "python-scanner"
version = "0.2.0"
description = "Escáner de puertos con Nmap y reporte en español"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
